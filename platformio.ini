; ESP32-S3 Router Serial Console Bridge
; See docs/hardware.md for the verified facts behind every pin below.

[env:esp32s3_bridge]
; Pinned deliberately. platform 6.13.0 is the LAST release that bundles ESP-IDF 5.5.3
; (framework-espidf ~3.50503.0). Platform 7.0.x moved to ESP-IDF 6.0.x — see
; docs/hardware.md §5 for why this project stays on 5.5.3.
platform  = espressif32@6.13.0
board     = esp32-s3-devkitc-1
framework = espidf

; The stock esp32-s3-devkitc-1 board file is the N8 variant: 8 MB flash, NO PSRAM.
; These override it for the N16R8 module. Must stay consistent with
; CONFIG_ESPTOOLPY_FLASHSIZE_16MB in sdkconfig.defaults — the PlatformIO espidf builder
; cross-checks the two and warns on mismatch (builder/frameworks/espidf.py:2098).
; UNVERIFIED until esptool flash_id runs against the board; see docs/hardware.md §4.
board_upload.flash_size   = 16MB
board_upload.maximum_size = 16777216
board_build.partitions    = partitions.csv

; Verified on this machine 2026-08-09 (docs/hardware.md §4). The board's "COM" USB-C is
; an FTDI FT232R (0403:6001), NOT the CH343/CP2102N that SPEC §2.1 assumed — hence the
; usbserial-<FTDI serial> node name rather than wchusbserial. This carries UART0:
; diagnostics, flashing and the esp_console control channel. It is NOT the router data
; channel; that is the native USB port (303a:1001 when idle, see docs/usage.md).
upload_port   = /dev/cu.usbserial-A5069RR4
monitor_port  = /dev/cu.usbserial-A5069RR4
monitor_speed = 115200

; Stop the monitor from toggling DTR/RTS, which would reset the board mid-session and
; interrupt the bridge.
monitor_rts = 0
monitor_dtr = 0

build_flags =
    -DCONFIG_BRIDGE_UART_TX=17
    -DCONFIG_BRIDGE_UART_RX=18
